</style></head> <body data-astro-cid-bzl2wvoy> <header class="wrap" data-astro-cid-bzl2wvoy> <div class="title" data-astro-cid-bzl2wvoy> <h1 data-astro-cid-bzl2wvoy>マニュアルポータル</h1> <p class="lead" data-astro-cid-bzl2wvoy>分散しているマニュアルを集約し、迷わず目的の資料にたどり着ける閲覧ポータルです。</p> </div> <div class="toolbar" data-astro-cid-bzl2wvoy> <div class="search" aria-label="search" data-astro-cid-bzl2wvoy> <span aria-hidden="true" data-astro-cid-bzl2wvoy>🔎</span> <input id="q" type="text" placeholder="マニュアルの絞り込み（例：業務 インストール）" data-astro-cid-bzl2wvoy> <button id="clearBtn" type="button" aria-label="clear" data-astro-cid-bzl2wvoy>×</button> </div> <div class="mode" data-astro-cid-bzl2wvoy> <button id="modeAnd" class="active" data-astro-cid-bzl2wvoy>AND</button> <button id="modeOr" data-astro-cid-bzl2wvoy>OR</button> </div> <div class="hint" data-astro-cid-bzl2wvoy>※ キーワードは空白区切り</div> </div> </header> <main class="wrap" data-astro-cid-bzl2wvoy> <section class="grid" id="cards" data-astro-cid-bzl2wvoy> <article class="card" data-search="郵送作業マニュアル 「郵送業務依頼共有」における郵送作業の手順を説明します。 業務 HTML DDS部" data-astro-cid-bzl2wvoy> <a href="/manual-portal/manuals/manual_00/index.html" target="_blank" rel="noopener noreferrer" data-astro-cid-bzl2wvoy> <h2 data-astro-cid-bzl2wvoy>郵送作業マニュアル</h2> <p class="desc" data-astro-cid-bzl2wvoy>「郵送業務依頼共有」における郵送作業の手順を説明します。</p> <div class="meta" data-astro-cid-bzl2wvoy> <div class="tags" data-astro-cid-bzl2wvoy> <span class="tag" data-astro-cid-bzl2wvoy>業務</span><span class="tag" data-astro-cid-bzl2wvoy>HTML</span><span class="tag" data-astro-cid-bzl2wvoy>DDS部</span> </div> <div class="updated" data-astro-cid-bzl2wvoy>更新: 2025-07-12</div> </div> </a> </article><article class="card" data-search="Teamsインストールマニュアル（無料版Teams） 無料版Teamsをインストールする手順を説明します。 ツール HTML 全社" data-astro-cid-bzl2wvoy> <a href="/manual-portal/manuals/manual_01/index.html" target="_blank" rel="noopener noreferrer" data-astro-cid-bzl2wvoy> <h2 data-astro-cid-bzl2wvoy>Teamsインストールマニュアル（無料版Teams）</h2> <p class="desc" data-astro-cid-bzl2wvoy>無料版Teamsをインストールする手順を説明します。</p> <div class="meta" data-astro-cid-bzl2wvoy> <div class="tags" data-astro-cid-bzl2wvoy> <span class="tag" data-astro-cid-bzl2wvoy>ツール</span><span class="tag" data-astro-cid-bzl2wvoy>HTML</span><span class="tag" data-astro-cid-bzl2wvoy>全社</span> </div> <div class="updated" data-astro-cid-bzl2wvoy>更新: 2025-09-12</div> </div> </a> </article><article class="card" data-search="転入届処理マニュアル 転入届の処理手順を説明します。 業務 PDF 市民課" data-astro-cid-bzl2wvoy> <a href="/manual-portal/manuals/manual_02/サンプル転入届処理マニュアル_20241111.pdf" target="_blank" rel="noopener noreferrer" data-astro-cid-bzl2wvoy> <h2 data-astro-cid-bzl2wvoy>転入届処理マニュアル</h2> <p class="desc" data-astro-cid-bzl2wvoy>転入届の処理手順を説明します。</p> <div class="meta" data-astro-cid-bzl2wvoy> <div class="tags" data-astro-cid-bzl2wvoy> <span class="tag" data-astro-cid-bzl2wvoy>業務</span><span class="tag" data-astro-cid-bzl2wvoy>PDF</span><span class="tag" data-astro-cid-bzl2wvoy>市民課</span> </div> <div class="updated" data-astro-cid-bzl2wvoy>更新: 2025-12-13</div> </div> </a> </article> </section> </main> <script>
      const input = document.getElementById("q");
      const cards = [...document.querySelectorAll("[data-search]")];
      const btnAnd = document.getElementById("modeAnd");
      const btnOr = document.getElementById("modeOr");
      const clearBtn = document.getElementById("clearBtn");

      let mode = "AND";

      function normalize(s) {
        return (s || "").toLowerCase();
      }

      function applyFilter() {
        const terms = normalize(input.value).split(/\s+/).filter(Boolean);
        for (const el of cards) {
          const hay = normalize(el.getAttribute("data-search"));
          let match = true;
          if (terms.length) {
            match = (mode === "AND")
              ? terms.every(t => hay.includes(t))
              : terms.some(t => hay.includes(t));
          }
          el.style.display = match ? "" : "none";
        }
      }

      function updateClear() {
        if (!clearBtn) return;
        clearBtn.classList.toggle("hidden", !input.value);
      }

      input?.addEventListener("input", () => { applyFilter(); updateClear(); });

      btnAnd?.addEventListener("click", () => {
        mode = "AND";
        btnAnd.classList.add("active");
        btnOr.classList.remove("active");
        applyFilter();
      });

      btnOr?.addEventListener("click", () => {
        mode = "OR";
        btnOr.classList.add("active");
        btnAnd.classList.remove("active");
        applyFilter();
      });

      clearBtn?.addEventListener("click", () => {
        input.value = "";
        applyFilter();
        updateClear();
        input.focus();
      });

      updateClear();
      applyFilter();
    </script> </body> </html>
